# src/ms-notifications/ms-notifications.graphql

type Notification {
  id: ID!
  userId: String!
  content: String!
  type: String!
  source: String!
  triggeredBy: String
  isRead: Boolean!
  createdAt: String!
}

# Renvoie uniquement les notifications de l'appelant authentifié (nom
# conservé pour compatibilité, voir le resolver).
type Query {
  getAllNotifications: [Notification]!
}

# channels : canaux de livraison additionnels demandés en plus de la
# persistance in-app (toujours effectuée), ex: ["EMAIL"]. Pas d'argument
# `email` : l'adresse est toujours résolue côté serveur, jamais fournie par
# l'appelant (voir NotificationDispatcherService / UserLookupService).
type Mutation {
  createNotification(userId: ID!, content: String!, channels: [String!]): Notification!
  markNotificationAsRead(id: ID!): Notification!
}

type User @key(fields: "id") {
  id: ID!
  notifications: [Notification]
}