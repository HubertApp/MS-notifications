# src/ms-notifications/ms-notifications.graphql

type Notification {
  id: ID!
  userId: String!
  content: String!
  type: String!
  source: String!
  triggeredBy: String
  isRead: Boolean!
  createdAt: String!
}

# Renvoie uniquement les notifications de l'appelant authentifié (nom
# conservé pour compatibilité, voir le resolver).
type Query {
  getAllNotifications: [Notification]!
}

type Mutation {
  createNotification(userId: ID!, content: String!): Notification!
}

type User @key(fields: "id") {
  id: ID!
  notifications: [Notification]
}