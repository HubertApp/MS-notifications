version: '3.8'

services:
  ms-notifications:
    build: .
    container_name: ms-notifications-container
    ports:
      - "3001:3001" # Ton port API
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongodb:27017/hubertapp_notifications
      # Canal e-mail : facultatif, voir .env.example. Non fourni ici, à
      # renseigner via un fichier .env local si besoin (env_file plus bas).
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy # On attend que Rabbit soit "Healthy"
      mongodb:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-container
    ports:
      - "5672:5672"   # Port communication
      - "15672:15672" # Port interface web
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongodb-notifications-container
    ports:
      - "27018:27017"
    volumes:
      - mongo_notifications_data:/data/db
    networks:
      - app-network

volumes:
  mongo_notifications_data:

networks:
  app-network:
    driver: bridge